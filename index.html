<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Munajjim Premium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="logo">L</div>
    <h2>Munajjim premium</h2>

    <form id="paymentForm">
      <label for="cardNumber">Karta Raqam</label>
      <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required />

      <label for="expiry">Amal qilish muddati</label>
      <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required />

      <button type="submit">Yuborish</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
